.hero:before{display:none}.hero h1{font-size:clamp(43px,5.5vw,72px);letter-spacing:-1px;text-shadow:0 3px 16px #0009}.hero p{font-size:15px;max-width:610px;color:#f0f3f5;text-shadow:0 1px 5px #000b}.eyebrow{color:#ffdfab}.pill{background:rgba(7,16,25,.48);backdrop-filter:blur(8px)}

.card,.notice,.v9-planner,.v11-details,.quicktile,.moretile,.v9-assigned{background:rgba(14,26,35,.76)!important;border:1px solid rgba(255,255,255,.20)!important;box-shadow:0 12px 32px #0003!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#f8fbff!important}
.card{border-radius:19px;padding:18px}.card p,.small,.muted,.day,.stat span,.v11-summary span{color:#d6e0e7!important}
.tag{background:rgba(31,136,173,.32);color:#effcff}.warn{background:rgba(204,139,35,.24);color:#ffe6b5}.title{color:#fff}.notice{border-radius:15px;padding:15px;line-height:1.6}

.footer{color:#d6e4ec!important}.footer p{color:#d6e4ec!important}

function href(u,t='Website'){return `<a class="btn" href="${escapeHTML(u)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHTML(t)}</a>`}
function maps(t){return href('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(t+' South Africa')+'&travelmode=driving','📍 Google Maps · Route')}
function head(t,sub=''){return `<div class="head"><div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div></div>`}
function fav(id){return `<button type="button" class="fav" data-fav="${escapeHTML(id)}" aria-label="Favorit umschalten" aria-pressed="${!!state.favorites[id]}">${state.favorites[id]?'★':'☆'}</button>`}

function start(){let i=todayStop();return `${head('Deine Reise auf einen Blick','Alles Wichtige für die Garden Route an einem Ort')}<div class="grid cols3"><div class="card stat"><strong>30</strong><span>Reisetage vor Ort</span></div><div class="card stat"><strong>12</strong><span>Stationen</span></div><div class="card stat"><strong>29</strong><span>Nächte</span></div></div><div class="card" style="margin-top:12px"><span class="tag">Dein nächster Schritt</span><h3 class="title">Reiseorte mit einem Tipp öffnen</h3><p class="small muted">Jeder Ort hat jetzt eine eigene Detailansicht mit Highlights, wichtigen Hinweisen, Restaurantlinks und deinen Notizen.</p><button class="btn primary" data-nav="route">12 Orte entdecken →</button></div><div class="grid cols2" style="margin-top:12px"><div class="card"><span class="tag">✈ Hinreise</span><h3 class="title">Frankfurt → Kapstadt</h3><p class="small">Mo., 25.01.2027 · 21:55 Uhr<br>Ankunft Di., 26.01. · 10:45 Uhr</p><p class="hint">Flugnummer und Buchungsdetails bitte ergänzen.</p></div><div class="card"><span class="tag">✈ Rückreise</span><h3 class="title">Kapstadt → Frankfurt</h3><p class="small">Mi., 24.02.2027 · 19:50 Uhr<br>Ankunft Do., 25.02. · 07:00 Uhr</p><p class="hint">Zeiten aus bisheriger Reiseplanung, nicht live geprüft.</p></div></div>${i>=0?`<div class="card" style="margin-top:12px"><span class="tag">Du bist gerade hier</span><h3 class="title">${escapeHTML(DATA.trip[i][0])}</h3><p class="small">${dt(DATA.dates[i][0])} – ${dt(DATA.dates[i][1])}</p><div class="actions">${maps(DATA.trip[i][0])}<button class="btn primary" data-nav="route">Alle Reiseorte</button></div></div>`:''}<div class="card" style="margin-top:12px"><h3 class="title">Deine Reise, deine Daten</h3><p class="small muted">Ergänze Unterkünfte, Buchungsnummern, persönliche Notizen und Favoriten. Die Daten bleiben lokal auf deinem iPhone oder PC. Unter „Meine Daten“ kannst du jederzeit eine Sicherung exportieren.</p><div class="actions"><button class="btn primary" data-nav="plan">Buchungen & Notizen</button><button class="btn" data-nav="route">Reiseroute</button><button class="btn" data-nav="check">Checkliste</button><button class="btn" data-nav="days">Tagesplaner</button><button class="btn" data-nav="budget">Budget</button></div></div><div class="notice">🔒 Die App überträgt deine persönlichen Eingaben nicht an uns. Externe Websites, Karten und Menüs benötigen Internet. Für vertrauliche Dokumente wie Passkopien oder Kreditkartennummern ist diese App nicht vorgesehen.</div>`}
function route(){let rows=DATA.trip.map((x,i)=>({x,i})).filter(({x})=>x.join(' ').toLowerCase().includes(search.toLowerCase()));return `${head('Die Route','Chronologisch · mit Platz für deine Unterkunftsnotizen')}<div class="toolbar"><input id="search" class="field" type="search" placeholder="Ort suchen …" value="${escapeHTML(search)}"></div><div class="grid">${rows.map(({x,i})=>`<article class="card"><div class="row"><div class="stopnum">${String(i+1).padStart(2,'0')}</div><div class="grow"><div class="day">${dt(DATA.dates[i][0])} – ${dt(DATA.dates[i][1])} · ${escapeHTML(x[2])}</div><h3 class="title" style="margin:5px 0">${escapeHTML(x[0])}</h3><p class="small muted">${escapeHTML(x[3])}</p></div>${fav('stop-'+i)}</div><div class="actions">${maps(x[0])}<button class="btn primary" data-stop="${i}">Details →</button><button class="btn" data-bookplace="${escapeHTML(x[0])}">＋ Buchung</button></div>${state.notes['stop-'+i]?`<p class="small">📝 ${escapeHTML(state.notes['stop-'+i])}</p>`:''}</article>`).join('')||'<div class="empty">Kein Ort gefunden.</div>'}</div><div class="notice">Alle An- und Abreisetage sind aufeinander abgestimmt. Die Reisezeiten zwischen den Orten sind nicht berechnet; Navigation und Straßenbedingungen vor der jeweiligen Fahrt prüfen.</div>`}
function catalog(kind){let isGolf=kind==='golf',a=isGolf?DATA.golf:DATA.restaurants;let groups=[...new Set(a.map(x=>x[isGolf?1:0]))];let rows=a.map((x,i)=>({x,i})).filter(({x,i})=>(filter==='all'||x[isGolf?1:0]===filter)&&(!onlyFav||state.favorites[kind+'-'+i])&&x.join(' ').toLowerCase().includes(search.toLowerCase()));return `${head(isGolf?'Golfplätze':'Restaurants',isGolf?'16 Plätze · Greenfees nur als Orientierung':'28 Empfehlungen · Menüs und Webseiten')}<div class="toolbar"><input class="field" id="search" type="search" placeholder="Name oder Ort suchen …" value="${escapeHTML(search)}"><select class="field filter" id="filter" aria-label="Region filtern"><option value="all">Alle Regionen</option>${groups.map(g=>`<option value="${escapeHTML(g)}" ${filter===g?'selected':''}>${escapeHTML(g)}</option>`).join('')}</select><label class="btn"><input type="checkbox" id="onlyFav" ${onlyFav?'checked':''}> Nur Favoriten</label></div><div class="grid cols2">${rows.map(({x,i})=>`<article class="card"><div class="row"><div class="grow"><span class="tag">${escapeHTML(x[isGolf?1:0])}</span><h3 class="title">${escapeHTML(x[isGolf?0:1])}</h3></div>${fav(kind+'-'+i)}</div>${isGolf?`<p class="small"><strong>${escapeHTML(x[2])}</strong></p><p class="small muted">${escapeHTML(x[3])}</p>`:`<p class="small muted">${escapeHTML(x[2])}</p>`}<div class="actions">${href(x[isGolf?4:3],isGolf?'Club & Preise':'Menü / Website')}${maps(x[isGolf?0:1])}<button class="btn light" data-bookplace="${escapeHTML(x[isGolf?0:1])}">＋ Vormerken</button></div></article>`).join('')||'<div class="card empty">Keine Treffer – Filter anpassen.</div>'}</div><div class="notice">${isGolf?'⛳ Die angezeigten Preise stammen aus früherer Recherche und sind keine garantierten Februar-2027-Angebote. Handicapanforderungen, Spielberechtigung, Cart, Leihschläger und Startzeiten direkt beim Club bestätigen.':'🍽️ Menüs, Preise und Öffnungszeiten können sich bis 2027 ändern. Ein Website-Link bedeutet nicht, dass bereits eine Reservierung besteht.'}</div>`}
function plan(){return `${head('Meine Buchungen','Flüge, Hotels, Mietwagen, Golf und Restaurants verwalten')}<div class="card"><h3 class="title">Neue Buchung oder Vormerkung</h3><form id="bookingForm"><div class="grid cols2"><div><label class="label" for="btype">Kategorie</label><select id="btype" class="field"><option>Unterkunft</option><option>Flug</option><option>Mietwagen</option><option>Golf</option><option>Restaurant</option><option>Aktivität</option><option>Sonstiges</option></select></div><div><label class="label" for="bstatus">Status</label><select id="bstatus" class="field"><option>Idee / offen</option><option>Angefragt</option><option>Bestätigt</option><option>Bezahlt</option></select></div></div><label class="label" for="bname">Name / Anbieter</label><input class="field" id="bname" maxlength="140" required placeholder="z. B. Hotel in Hermanus"><div class="grid cols2"><div><label class="label" for="bdate">Datum</label><input id="bdate" type="date" class="field"></div><div><label class="label" for="bref">Buchungsreferenz (optional)</label><input id="bref" class="field" maxlength="120"></div></div><label class="label" for="binfo">Notizen / Adresse / Uhrzeit</label><textarea id="binfo" class="field notearea" maxlength="1500"></textarea><button type="submit" class="btn primary" style="margin-top:12px">＋ Speichern</button></form></div><div class="head" style="margin-top:20px"><div><h2>Gespeicherte Einträge</h2><p>${state.bookings.length} Einträge auf diesem Gerät</p></div></div><div class="grid">${state.bookings.map(b=>`<div class="card"><div class="row"><div class="grow"><span class="tag">${escapeHTML(b.type)} · ${escapeHTML(b.status)}</span><h3 class="title">${escapeHTML(b.name)}</h3><p class="small muted">${b.date?escapeHTML(dt(b.date))+' · ':''}${escapeHTML(b.ref||'')}</p><p class="small">${escapeHTML(b.info||'')}</p></div><button class="btn danger" data-delete="${escapeHTML(b.id)}" aria-label="Eintrag löschen">Löschen</button></div></div>`).join('')||'<di const SA_FX_KEY='sa2027-zar-eur-rate-v1';
let saFx=null;
try{const v=JSON.parse(localStorage.getItem(SA_FX_KEY)||'null');if(v&&Number.isFinite(v.rate)&&v.rate>0)saFx=v;}catch(e){}
async function saUpdateFx(){
 try{
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),6500);
  let response;
  try{response=await fetch('https://api.frankfurter.dev/v1/latest?base=ZAR&symbols=EUR',{cache:'no-store',signal:controller.signal});}
  finally{clearTimeout(timer);}
  if(!response.ok)throw Error('Wechselkurs nicht verfügbar');
  const data=await response.json(),rate=Number(data.rates&&data.rates.EUR);
  if(!Number.isFinite(rate)||rate<=0)throw Error('Ungültiger Wechselkurs');
  saFx={rate,date:data.date||new Date().toISOString().slice(0,10),retrievedAt:new Date().toISOString()};
  try{localStorage.setItem(SA_FX_KEY,JSON.stringify(saFx));}catch(e){}
 }catch(e){}
 saPaintFx();
}
function saPaintFx(){
 const currency=document.getElementById('ecurrency'),info=document.getElementById('expenseFxInfo'),amount=document.getElementById('eamount'),label=document.getElementById('expenseAmountLabel');
 if(!currency||!info||!amount)return;
 const zar=currency.value==='ZAR';
 if(label)label.textContent=zar?'Betrag (ZAR)':'Betrag (€)';
 amount.placeholder=zar?'z. B. 350.00':'z. B. 25.00';
 if(!zar){info.textContent='Die Übersichten zeigen ausschließlich Eurobeträge.';return;}
 if(!saFx){info.textContent='Wechselkurs wird geladen. Ohne verfügbaren Kurs kann ein Rand-Betrag nicht gespeichert werden.';return;}
 const value=Number(amount.value),euro=value>0?(value*saFx.rate).toLocaleString('de-DE',{style:'currency',currency:'EUR'}):'—';
 const cached=new Date(saFx.retrievedAt).getTime();
 const age=Date.now()-cached;
 const stale=age>36*3600*1000;
 info.textContent=`${value>0?'Umgerechnet: '+euro+' · ':''}1 ZAR = ${saFx.rate.toLocaleString('de-DE',{maximumFractionDigits:6})} EUR · Kursdatum ${saFx.date}${stale?' · zuletzt gespeicherter Kurs (offline/veraltet)':' · gespeicherter Kurs'}.`;
}

 <div class="v13-grid" style="margin-top:12px">${items.length?items.map(x=>`<article class="card"><span class="tag">${v13Esc(x[golf?1:0])}</span><h3 class="title">${v13Esc(x[golf?0:1])}</h3><p class="small">${v13Esc(x[2])}</p>${golf?`<p class="small muted">${v13Esc(x[3])}</p>`:''}<div class="actions">${href(x[golf?4:3],golf?'Club / Greenfees':'Restaurant / Menü')}${maps(x[golf?0:1])}</div><div class="actions"><button class="btn primary" data-v13book="${v13Esc(x[golf?0:1])}" data-v13type="${golf?'Golf':'Restaurant'}">＋ Buchung planen</button></div></article>`).join(''):'<div class="card"><p>Für diesen Reiseort ist noch kein passender Eintrag hinterlegt.</p></div>'}</div>
 <div class="notice">${golf?'Greenfees sind historische Orientierungswerte, keine bestätigten Tarife für Februar 2027. Startzeiten, Leihschläger und Spielberechtigung beim Club prüfen.':'Restaurantlinks und Empfehlungen sind keine Live-Verfügbarkeitsprüfung. Tischreservierungen bitte direkt bestätigen lassen.'}</div>`;
}
function v13OfflineHub(){
 const bookings=(state.bookings||[]).filter(b=>b.date&&b.date>='2027-01-26'&&b.date<='2027-02-24').sort((a,b)=>a.date.localeCompare(b.date));
 return `<div class="v13-hero v13-offline"><h2>Offline-Reisemappe</h2><p>Deine wichtigsten Daten auch ohne Mobilfunkverbindung</p></div>
 <div class="v13-warning">Die App-Oberfläche und lokal gespeicherte Daten sind nach dem ersten Online-Aufruf offline nutzbar. Externe Ortsfotos sind dabei nicht garantiert verfügbar. Google Maps, aktuelle Preise und externe Webseiten benötigen Internet. Kein automatischer Datenabgleich zwischen Geräten.</div>
 <div class="v13-grid"><section class="card"><h3 class="title">Feste Reiseetappen</h3>${DATA.trip.map((x,i)=>`<div class="v13-item"><strong>${String(i+1).padStart(2,'0')} · ${v13Esc(x[0])}</strong><p class="small">${v13Esc(x[1])} · ${v13Esc(x[2])}</p>${state.stopNotes?.[i]?`<p class="small">${v13Esc(state.stopNotes[i])}</p>`:''}</div>`).join('')}</section>
 <section class="card"><h3 class="title">Deine Reisebuchungen</h3>${bookings.length?bookings.map(b=>`<div class="v13-item"><strong>${v13Esc(b.name)}</strong><p class="small">${dt(b.date)} · ${v13Esc(b.type||'Buchung')} · ${v13Esc(b.status||'')}</p>${b.ref?`<p class="small">Referenz: ${v13Esc(b.ref)}</p>`:''}${b.info?`<p class="small">${v13Esc(b.info)}</p>`:''}</div>`).join(''):'<p class="small">Noch keine Buchungen erfasst.</p>'}
 <div class="actions"><button class="btn primary" data-v13page="data">Daten sichern</button><button class="btn" data-v13page="check">Reisecheckliste</button></div></section></div>`;
}
// Vorhandene Startseite und „Mehr“ um die Premium-Navigation ergänzen.
const v13PreviousStart=start;
start=function(){return v13Links()+v13PreviousStart()};
const v13PreviousMore=more;
more=function(){return v13Links()+v13PreviousMore()};
const v13PreviousRender=render;
render=function(){
 if(['assistant','bookinghub','golfhub','foodhub','offlinehub'].includes(page)){
   const output=page==='assistant'?v13Assistant():page==='bookinghub'?v13BookingHub():page==='golfhub'?v13PlaceHub('golf'):page==='foodhub'?v13PlaceHub('food'):v13OfflineHub();
   $('#view').innerHTML=output;
   if(typeof premiumContext==='function')premiumContext();
   document.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);el.setAttribute('aria-current',el.dataset.page===page?'page':'false')});
   return;
 }
 v13PreviousRender();
};
document.addEventListener('click',function(e){
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v13page){e.preventDefault();e.stopImmediatePropagation();v13EditingBooking=null;v13Open(b.dataset.v13page);return}
 if(b.dataset.v13edit){e.preventDefault();e.stopImmediatePropagation();const entry=(state.bookings||[]).find(x=>String(x.id)===b.dataset.v13edit);if(!entry)return;v13EditingBooking=String(entry.id);v13Open('plan');for(const [id,val] of Object.entries({btype:entry.type,bstatus:entry.status,bname:entry.name,bdate:entry.date,bref:entry.ref,binfo:entry.info})){const el=document.getElementById(id);if(el)el.value=val||'';}const submit=document.querySelector('#bookingForm button[type=submit]');if(submit)submit.textContent='✓ Änderungen speichern';document.querySelector('#bname')?.focus();return}
 if(b.dataset.v13step){e.preventDefault();e.stopImmediatePropagation();const next=datePlus(v13Date,Number(b.dataset.v13step));if(next>='2027-01-26'&&next<='2027-02-24'){v13Date=next;render()}return}
 if(b.dataset.v13book){e.preventDefault();e.stopImmediatePropagation();v13EditingBooking=null;v13Open('plan');const day=document.querySelector('#bdate');if(day)day.value=v13Date;const name=document.querySelector('#bname');if(name){name.value=b.dataset.v13book;const type=document.querySelector('#btype');if(type)type.value=b.dataset.v13type;name.focus()}return}
},true);
// Bestehende Buchung aktualisieren, ohne Duplikate oder neue IDs anzulegen.
document.addEventListener('submit',function(e){
 if(e.target.id!=='bookingForm'||!v13EditingBooking)return;
 e.preventDefault();e.stopImmediatePropagation();
 const item=(state.bookings||[]).find(x=>String(x.id)===v13EditingBooking);
 if(!item){v13EditingBooking=null;return}
 const name=document.getElementById('bname').value.trim();if(!name)return;
 Object.assign(item,{type:document.getElementById('btype').value,status:document.getElementById('bstatus').value,name:name.slice(0,140),date:document.getElementById('bdate').value,ref:document.getElementById('bref').value.trim().slice(0,120),info:document.getElementById('binfo').value.trim().slice(0,1500)});
 v13EditingBooking=null;save();render();
},true);
document.addEventListener('change',function(e){
 if(e.target.id==='v13Date'){e.stopImmediatePropagation();v13Date=e.target.value;render()}
 if(e.target.id==='v13Region'){e.stopImmediatePropagation();v13Region=Number(e.target.value);render()}
},true);

render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
