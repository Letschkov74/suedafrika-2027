const KEY='sa2027-premium-v2'; // Bewusst beibehalten: vorhandene V2-Eingaben bleiben erhalten.
const defaults={checks:{},favorites:{},notes:{},bookings:[],expenses:[],dayPlans:{},stopNotes:{},general:'',lastBackup:'',picks:{},documents:[]};
function getState(){try{let v=JSON.parse(localStorage.getItem(KEY)||'null');return v&&typeof v==='object'?{...structuredClone(defaults),...v}:structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
let state=getState(),page='start',search='',filter='all',onlyFav=false;
const $=s=>document.querySelector(s),escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));if($('#saveStatus'))$('#saveStatus').textContent='✓ Lokal gespeichert'}catch(e){alert('Speichern nicht möglich. Bitte Speicherplatz oder private Browser-Einstellungen prüfen.')}}
function href(u,t='Website'){return `<a class="btn" href="${escapeHTML(u)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHTML(t)}</a>`}
function maps(t){return href('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(t+' South Africa')+'&travelmode=driving','📍 Google Maps · Route')}
function head(t,sub=''){return `<div class="head"><div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div></div>`}
function fav(id){return `<button type="button" class="fav" data-fav="${escapeHTML(id)}" aria-label="Favorit umschalten" aria-pressed="${!!state.favorites[id]}">${state.favorites[id]?'★':'☆'}</button>`}
function dt(s){return new Date(s+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})}
function todayStop(){const now=new Date().toISOString().slice(0,10);return DATA.dates.findIndex(x=>x[0]<=now&&now<x[1])}
function start(){let i=todayStop();return `${head('Deine Reise auf einen Blick','Alles Wichtige für die Garden Route an einem Ort')}<div class="grid cols3"><div class="card stat"><strong>30</strong><span>Reisetage vor Ort</span></div><div class="card stat"><strong>12</strong><span>Stationen</span></div><div class="card stat"><strong>29</strong><span>Nächte</span></div></div><div class="card" style="margin-top:12px"><span class="tag">Dein nächster Schritt</span><h3 class="title">Reiseorte mit einem Tipp öffnen</h3><p class="small muted">Jeder Ort hat jetzt eine eigene Detailansicht mit Highlights, wichtigen Hinweisen, Restaurantlinks und deinen Notizen.</p><button class="btn primary" data-nav="route">12 Orte entdecken →</button></div><div class="grid cols2" style="margin-top:12px"><div class="card"><span class="tag">✈ Hinreise</span><h3 class="title">Frankfurt → Kapstadt</h3><p class="small">Mo., 25.01.2027 · 21:55 Uhr<br>Ankunft Di., 26.01. · 10:45 Uhr</p><p class="hint">Flugnummer und Buchungsdetails bitte ergänzen.</p></div><div class="card"><span class="tag">✈ Rückreise</span><h3 class="title">Kapstadt → Frankfurt</h3><p class="small">Mi., 24.02.2027 · 19:50 Uhr<br>Ankunft Do., 25.02. · 07:00 Uhr</p><p class="hint">Zeiten aus bisheriger Reiseplanung, nicht live geprüft.</p></div></div>${i>=0?`<div class="card" style="margin-top:12px"><span class="tag">Du bist gerade hier</span><h3 class="title">${escapeHTML(DATA.trip[i][0])}</h3><p class="small">${dt(DATA.dates[i][0])} – ${dt(DATA.dates[i][1])}</p><div class="actions">${maps(DATA.trip[i][0])}<button class="btn primary" data-nav="route">Alle Reiseorte</button></div></div>`:''}<div class="card" style="margin-top:12px"><h3 class="title">Deine Reise, deine Daten</h3><p class="small muted">Ergänze Unterkünfte, Buchungsnummern, persönliche Notizen und Favoriten. Die Daten bleiben lokal auf deinem iPhone oder PC. Unter „Meine Daten“ kannst du jederzeit eine Sicherung exportieren.</p><div class="actions"><button class="btn primary" data-nav="plan">Buchungen & Notizen</button><button class="btn" data-nav="route">Reiseroute</button><button class="btn" data-nav="check">Checkliste</button><button class="btn" data-nav="days">Tagesplaner</button><button class="btn" data-nav="budget">Budget</button></div></div><div class="notice">🔒 Die App überträgt deine persönlichen Eingaben nicht an uns. Externe Websites, Karten und Menüs benötigen Internet. Für vertrauliche Dokumente wie Passkopien oder Kreditkartennummern ist diese App nicht vorgesehen.</div>`}
function route(){let rows=DATA.trip.map((x,i)=>({x,i})).filter(({x})=>x.join(' ').toLowerCase().includes(search.toLowerCase()));return `${head('Die Route','Chronologisch · mit Platz für deine Unterkunftsnotizen')}<div class="toolbar"><input id="search" class="field" type="search" placeholder="Ort suchen …" value="${escapeHTML(search)}"></div><div class="grid">${rows.map(({x,i})=>`<article class="card"><div class="row"><div class="stopnum">${String(i+1).padStart(2,'0')}</div><div class="grow"><div class="day">${dt(DATA.dates[i][0])} – ${dt(DATA.dates[i][1])} · ${escapeHTML(x[2])}</div><h3 class="title" style="margin:5px 0">${escapeHTML(x[0])}</h3><p class="small muted">${escapeHTML(x[3])}</p></div>${fav('stop-'+i)}</div><div class="actions">${maps(x[0])}<button class="btn primary" data-stop="${i}">Details →</button><button class="btn" data-bookplace="${escapeHTML(x[0])}">＋ Buchung</button></div>${state.notes['stop-'+i]?`<p class="small">📝 ${escapeHTML(state.notes['stop-'+i])}</p>`:''}</article>`).join('')||'<div class="empty">Kein Ort gefunden.</div>'}</div><div class="notice">Alle An- und Abreisetage sind aufeinander abgestimmt. Die Reisezeiten zwischen den Orten sind nicht berechnet; Navigation und Straßenbedingungen vor der jeweiligen Fahrt prüfen.</div>`}
function catalog(kind){let isGolf=kind==='golf',a=isGolf?DATA.golf:DATA.restaurants;let groups=[...new Set(a.map(x=>x[isGolf?1:0]))];let rows=a.map((x,i)=>({x,i})).filter(({x,i})=>(filter==='all'||x[isGolf?1:0]===filter)&&(!onlyFav||state.favorites[kind+'-'+i])&&x.join(' ').toLowerCase().includes(search.toLowerCase()));return `${head(isGolf?'Golfplätze':'Restaurants',isGolf?'16 Plätze · Greenfees nur als Orientierung':'28 Empfehlungen · Menüs und Webseiten')}<div class="toolbar"><input class="field" id="search" type="search" placeholder="Name oder Ort suchen …" value="${escapeHTML(search)}"><select class="field filter" id="filter" aria-label="Region filtern"><option value="all">Alle Regionen</option>${groups.map(g=>`<option value="${escapeHTML(g)}" ${filter===g?'selected':''}>${escapeHTML(g)}</option>`).join('')}</select><label class="btn"><input type="checkbox" id="onlyFav" ${onlyFav?'checked':''}> Nur Favoriten</label></div><div class="grid cols2">${rows.map(({x,i})=>`<article class="card"><div class="row"><div class="grow"><span class="tag">${escapeHTML(x[isGolf?1:0])}</span><h3 class="title">${escapeHTML(x[isGolf?0:1])}</h3></div>${fav(kind+'-'+i)}</div>${isGolf?`<p class="small"><strong>${escapeHTML(x[2])}</strong></p><p class="small muted">${escapeHTML(x[3])}</p>`:`<p class="small muted">${escapeHTML(x[2])}</p>`}<div class="actions">${href(x[isGolf?4:3],isGolf?'Club & Preise':'Menü / Website')}${maps(x[isGolf?0:1])}<button class="btn light" data-bookplace="${escapeHTML(x[isGolf?0:1])}">＋ Vormerken</button></div></article>`).join('')||'<div class="card empty">Keine Treffer – Filter anpassen.</div>'}</div><div class="notice">${isGolf?'⛳ Die angezeigten Preise stammen aus früherer Recherche und sind keine garantierten Februar-2027-Angebote. Handicapanforderungen, Spielberechtigung, Cart, Leihschläger und Startzeiten direkt beim Club bestätigen.':'🍽️ Menüs, Preise und Öffnungszeiten können sich bis 2027 ändern. Ein Website-Link bedeutet nicht, dass bereits eine Reservierung besteht.'}</div>`}
function plan(){return `${head('Meine Buchungen','Flüge, Hotels, Mietwagen, Golf und Restaurants verwalten')}<div class="card"><h3 class="title">Neue Buchung oder Vormerkung</h3><form id="bookingForm"><div class="grid cols2"><div><label class="label" for="btype">Kategorie</label><select id="btype" class="field"><option>Unterkunft</option><option>Flug</option><option>Mietwagen</option><option>Golf</option><option>Restaurant</option><option>Aktivität</option><option>Sonstiges</option></select></div><div><label class="label" for="bstatus">Status</label><select id="bstatus" class="field"><option>Idee / offen</option><option>Angefragt</option><option>Bestätigt</option><option>Bezahlt</option></select></div></div><label class="label" for="bname">Name / Anbieter</label><input class="field" id="bname" maxlength="140" required placeholder="z. B. Hotel in Hermanus"><div class="grid cols2"><div><label class="label" for="bdate">Datum</label><input id="bdate" type="date" class="field"></div><div><label class="label" for="bref">Buchungsreferenz (optional)</label><input id="bref" class="field" maxlength="120"></div></div><label class="label" for="binfo">Notizen / Adresse / Uhrzeit</label><textarea id="binfo" class="field notearea" maxlength="1500"></textarea><button type="submit" class="btn primary" style="margin-top:12px">＋ Speichern</button></form></div><div class="head" style="margin-top:20px"><div><h2>Gespeicherte Einträge</h2><p>${state.bookings.length} Einträge auf diesem Gerät</p></div></div><div class="grid">${state.bookings.map(b=>`<div class="card"><div class="row"><div class="grow"><span class="tag">${escapeHTML(b.type)} · ${escapeHTML(b.status)}</span><h3 class="title">${escapeHTML(b.name)}</h3><p class="small muted">${b.date?escapeHTML(dt(b.date))+' · ':''}${escapeHTML(b.ref||'')}</p><p class="small">${escapeHTML(b.info||'')}</p></div><button class="btn danger" data-delete="${escapeHTML(b.id)}" aria-label="Eintrag löschen">Löschen</button></div></div>`).join('')||'<div class="card empty">Noch keine Buchungen eingetragen.</div>'}</div><div class="card" style="margin-top:14px"><h3 class="title">Allgemeine Reisenotizen</h3><textarea id="general" class="field notearea" placeholder="Ideen, Telefonnummern, Anreisehinweise …">${escapeHTML(state.general||'')}</textarea><p class="hint">Wird beim Verlassen des Textfelds gespeichert.</p></div>`}
function checks(){let total=DATA.checks.reduce((n,x)=>n+x[1].length,0),done=Object.values(state.checks).filter(Boolean).length;return `${head('Checkliste',`${done} von ${total} erledigt`)}<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${100*done/total}%"></i></div><div class="grid" style="margin-top:14px">${DATA.checks.map((g,i)=>`<div class="card"><h3 class="title">${['🗓️','🚙','🎒'][i]} ${escapeHTML(g[0])}</h3>${g[1].map((t,j)=>`<label class="check"><input type="checkbox" data-check="${i}-${j}" ${state.checks[i+'-'+j]?'checked':''}><span style="${state.checks[i+'-'+j]?'text-decoration:line-through;color:#819087':''}">${escapeHTML(t)}</span></label>`).join('')}</div>`).join('')}</div><div class="actions"><button class="btn danger" id="reset">Checkliste zurücksetzen</button></div>`}
function dataPage(){return `${head('Meine Daten & Installation','Datensicherung, Wiederherstellung und iPhone-Tipps')}<div class="card"><h3 class="title">💾 Sicherung erstellen</h3><p class="small muted">Exportiert Buchungen, Checklisten, Favoriten und Notizen in eine JSON-Datei. Gut geeignet, um Daten vom Windows-PC auf das iPhone zu übertragen.</p><div class="actions"><button class="btn primary" id="export">↓ Sicherung herunterladen</button><label class="btn" for="import">↑ Sicherung einlesen</label><input id="import" class="hidden" type="file" accept=".json,application/json"></div><p class="hint" id="saveStatus">Lokal gespeichert · letzte Sicherung: ${escapeHTML(state.lastBackup||'noch keine')}</p></div><div class="card" style="margin-top:12px"><h3 class="title">📅 Kalenderdatei</h3><p class="small muted">Feste Reiseetappen und deine Buchungen als iCalendar-Datei exportieren. Termine sind ganztägig, sofern keine Uhrzeit angegeben ist.</p><button class="btn primary" id="calendar">Kalender (.ics) herunterladen</button></div><div class="card" style="margin-top:12px"><h3 class="title">📱 Installation auf dem iPhone 14 Plus</h3><p class="small">1. Den gesamten App-Ordner auf einen HTTPS-Webhost wie GitHub Pages hochladen.</p><p class="small">2. Die veröffentlichte Adresse in <strong>Safari</strong> auf dem iPhone öffnen.</p><p class="small">3. <strong>Teilen → Zum Home-Bildschirm → Hinzufügen</strong> auswählen.</p><p class="small">4. App einmal online öffnen, damit die Grundfunktionen für Offline-Nutzung zwischengespeichert werden.</p><p class="hint">Ein ZIP oder eine lokale HTML-Datei lässt sich nicht als voll funktionsfähige PWA installieren. Eine HTTPS-Adresse ist erforderlich.</p></div><div class="card" style="margin-top:12px"><h3 class="title">🔄 Wichtiger Hinweis zur Synchronisierung</h3><p class="small muted">Deine Eingaben bleiben auf dem jeweiligen Gerät und in der jeweiligen Browser-App gespeichert. Windows und iPhone synchronisieren sich nicht automatisch. Exportiere die Sicherung am einen Gerät und importiere sie am anderen. Beim Import werden die vorhandenen lokalen Daten ersetzt.</p></div><div class="card" style="margin-top:12px"><h3 class="title">Offizielle Quellen und Sicherheitscheck</h3><p class="small">Wichtige Primärquellen für Ausflüge und Nationalparks. Stand der Prüfung: Oktober 2026; Öffnungszeiten und Preise kurz vor Reisebeginn erneut prüfen.</p>${VERIFIED.map(x=>`<div class="listitem"><strong>${escapeHTML(x[0])}</strong><p class="small muted">${escapeHTML(x[2])}</p>${href(x[3],'Offizielle Quelle')}</div>`).join('')}</div><div class="card" style="margin-top:12px"><h3 class="title">Datenschutz</h3><p class="small muted">Keine Benutzerkonten und kein eingebautes Tracking. Beim Öffnen externer Webseiten gelten deren Datenschutzregeln. Keine Reisepassscans, vollständigen Kreditkartendaten oder Passwörter eintragen.</p><div class="actions"><button class="btn danger" id="wipe">Alle lokalen Daten löschen</button><button class="btn" id="print">Druckansicht</button></div></div>`}

function datesOfTrip(){let r=[], d=new Date('2027-01-26T12:00:00'),end=new Date('2027-02-24T12:00:00');while(d<=end){let iso=d.toISOString().slice(0,10),i=DATA.dates.findIndex(x=>x[0]<=iso&&iso<x[1]);if(i<0)i=11;r.push({iso,i});d.setDate(d.getDate()+1)}return r}

function downloadCalendar(){const clean=x=>String(x??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SA2027//Reiseplan//DE','CALSCALE:GREGORIAN'];DATA.trip.forEach((t,i)=>{let [a,b]=DATA.dates[i];lines.push('BEGIN:VEVENT','UID:stop-'+i+'@sa2027','DTSTAMP:20261013T000000Z','DTSTART;VALUE=DATE:'+a.replace(/-/g,''),'DTEND;VALUE=DATE:'+b.replace(/-/g,''),'SUMMARY:'+clean('Südafrika: '+t[0]),'DESCRIPTION:'+clean(t[3]),'END:VEVENT')});(state.bookings||[]).forEach((b,i)=>{if(!/^2027-\d\d-\d\d$/.test(b.date||''))return;let a=b.date.replace(/-/g,''),next=new Date(b.date+'T12:00:00');next.setDate(next.getDate()+1);lines.push('BEGIN:VEVENT','UID:booking-'+i+'@sa2027','DTSTAMP:20261013T000000Z','DTSTART;VALUE=DATE:'+a,'DTEND;VALUE=DATE:'+next.toISOString().slice(0,10).replace(/-/g,''),'SUMMARY:'+clean(b.type+': '+b.name),'DESCRIPTION:'+clean(b.status+' '+(b.info||'')),'END:VEVENT')});lines.push('END:VCALENDAR');let blob=new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Suedafrika-2027-Reisekalender.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}

dataPage=function(){return v7dataPage()+`<div class="notice"><strong>V8-Datensicherung:</strong> Der JSON-Export enthält auch deine Tageszuordnungen und Dokumentvermerke. Bitte regelmäßig sichern, besonders vor Updates oder Gerätewechsel. Keine automatische Synchronisation zwischen PC und iPhone.</div>`}
const v7render=render;
render=function(){if(page==='map'||page==='docs'){const out=page==='map'?mapPage():docPage();$('#view').innerHTML=out;document.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);el.setAttribute('aria-current',el.dataset.page===page?'page':'false')});return}v7render()}
// Capture listeners run before V7's delegated handlers, avoiding double navigation.
document.addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.mapstop!==undefined){selectedStop=Number(b.dataset.mapstop)}if(b.dataset.currentstop!==undefined){selectedStop=Number(b.dataset.currentstop)}if(b.dataset.pick){e.stopImmediatePropagation();const key=b.dataset.pick;const sel=[...document.querySelectorAll('[data-pickdate]')].find(x=>x.dataset.pickdate===key);if(!sel?.value){alert('Bitte zuerst einen Reisetag auswählen.');return}state.picks[key]=sel.value;save();render();return}if(b.dataset.unpick){e.stopImmediatePropagation();delete state.picks[b.dataset.unpick];save();render();return}if(b.dataset.docdelete){e.stopImmediatePropagation();if(confirm('Dokumentvermerk entfernen?')){state.documents=state.documents.filter(x=>x.id!==b.dataset.docdelete);save();render()}return}},true);
document.addEventListener('submit',function(e){if(e.target.id!=='docForm')return;e.preventDefault();e.stopImmediatePropagation();state.documents.push({id:String(Date.now()),name:$('#docname').value.trim(),stop:$('#docstop').value,info:$('#docinfo').value.trim()});save();render()},true);
window.addEventListener('online',()=>{if(page==='start')render()});window.addEventListener('offline',()=>{if(page==='start')render()});


// V9: Tagesplanung direkt in jeder Tageskarte, ohne Änderung des lokalen Speicherschlüssels.
let v9OpenDay='';
function v9Options(iso){
 const d=findStopDate(iso);if(!d)return [];
 const i=d.i, all=[];
 DEEP_ACTIVITIES[i].forEach(a=>all.push({kind:'Aktivität',name:a[0]}));
 DEEP_RESTAURANTS[i].forEach(a=>all.push({kind:'Restaurant',name:a[0]}));
 DATA.golf.forEach(g=>{if(String(g[1]||'').toLowerCase().includes(String(DATA.trip[i][0]).toLowerCase()))all.push({kind:'Golf',name:g[0]})});
 return all;
}
function v9DayWidget(iso){
 const planned=Object.entries(state.picks||{}).filter(([k,date])=>date===iso);
 const entries=planned.map(([key])=>{const parts=key.split('::'),kind=parts[0],name=parts.slice(2).join('::');return `<div class="v9-assigned"><span><strong>${escapeHTML(name)}</strong><span class="small muted"> · ${escapeHTML(kind)}</span></span><span class="v9-actions"><button class="btn" data-v9-move="${escapeHTML(key)}" data-v9-date="${iso}">Verschieben</button><button class="btn light" data-v9-remove="${escapeHTML(key)}">Entfernen</button></span></div>`}).join('');
 const options=v9Options(iso),active=v9OpenDay===iso;
 return `<section class="v9-planner"><strong>📌 Geplante Aktivitäten ${planned.length?'('+planned.length+')':''}</strong>${entries||'<p class="small muted">Noch keine Aktivitäten vorgemerkt.</p>'}<div class="v9-actions"><button class="btn primary" data-v9-toggle="${iso}" aria-expanded="${active?'true':'false'}">${active?'Schließen':'＋ Aktivität hinzufügen'}</button></div>${active?`<div><label class="label" for="v9-select-${iso}">Aktivität, Restaurant oder Golfplatz auswählen</label><select id="v9-select-${iso}" class="field" data-v9-select="${iso}"><option value="">Bitte auswählen …</option>${options.map(o=>{const key=pickKey(o.kind,findStopDate(iso).i,o.name);return `<option value="${escapeHTML(key)}">${escapeHTML(o.kind)} · ${escapeHTML(o.name)}</option>`}).join('')}</select><button class="btn primary" data-v9-add="${iso}">Auswahl für diesen Tag speichern</button><p class="small muted">Du kannst Einträge anschließend entfernen oder auf einen anderen Tag am selben Reiseort verschieben.</p></div>`:''}</section>`;
}
const v8days=days;
days=function(){
 let html=v8days();
 // Fügt den Planer innerhalb der Tageskarte unmittelbar vor dem Notizfeld ein.
 html=html.replace(/(<label class="label" for="day-(\d{4}-\d{2}-\d{2})">Mein Plan \/ Uhrzeiten \/ Reservierungen<\/label>)/g,(_,label,iso)=>v9DayWidget(iso)+label);
 return html;
};
// Capture phase: prevents legacy click listeners from handling V9 actions twice.
document.addEventListener('click',function(e){
 const b=e.target.closest('button');if(!b)return;
 const ds=b.dataset;
 if(ds.v9Toggle!==undefined){e.preventDefault();e.stopImmediatePropagation();v9OpenDay=v9OpenDay===ds.v9Toggle?'':ds.v9Toggle;render();return}
 if(ds.v9Add!==undefined){e.preventDefault();e.stopImmediatePropagation();const iso=ds.v9Add,sel=document.querySelector('[data-v9-select="'+iso+'"]');if(!sel?.value){alert('Bitte zuerst eine Aktivität auswählen.');return}const key=sel.value;const prev=state.picks[key];if(prev&&prev!==iso&&!confirm('Diese Aktivität ist bereits an einem anderen Tag geplant. Auf diesen Tag verschieben?'))return;state.picks[key]=iso;save();v9OpenDay='';render();return}
 if(ds.v9Remove!==undefined){e.preventDefault();e.stopImmediatePropagation();if(!confirm('Diesen Eintrag aus dem Tagesplan entfernen?'))return;delete state.picks[ds.v9Remove];save();render();return}
 if(ds.v9Move!==undefined){e.preventDefault();e.stopImmediatePropagation();const key=ds.v9Move,parts=key.split('::'),i=Number(parts[1]);const dates=datesOfTrip().filter(d=>d.i===i);const next=prompt('Neues Datum eingeben (JJJJ-MM-TT):\\n'+dates.map(d=>d.iso).join(', '),state.picks[key]);if(next===null)return;if(!dates.some(d=>d.iso===next)){alert('Bitte ein Datum am selben Reiseort auswählen.');return}state.picks[key]=next;save();render();return}
},true);

render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
