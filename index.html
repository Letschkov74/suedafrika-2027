TTPS-Adresse ist erforderlich.</p></div><div class="card" style="margin-top:12px"><h3 class="title">🔄 Wichtiger Hinweis zur Synchronisierung</h3><p class="small muted">Deine Eingaben bleiben auf dem jeweiligen Gerät und in der jeweiligen Browser-App gespeichert. Windows und iPhone synchronisieren sich nicht automatisch. Exportiere die Sicherung am einen Gerät und importiere sie am anderen. Beim Import werden die vorhandenen lokalen Daten ersetzt.</p></div><div class="card" style="margin-top:12px"><h3 class="title">Offizielle Quellen und Sicherheitscheck</h3><p class="small">Wichtige Primärquellen für Ausflüge und Nationalparks. Stand der Prüfung: Oktober 2026; Öffnungszeiten und Preise kurz vor Reisebeginn erneut prüfen.</p>${VERIFIED.map(x=>`<div class="listitem"><strong>${escapeHTML(x[0])}</strong><p class="small muted">${escapeHTML(x[2])}</p>${href(x[3],'Offizielle Quelle')}</div>`).join('')}</div><div class="card" style="margin-top:12px"><h3 class="title">Datenschutz</h3><p class="small muted">Keine Benutzerkonten und kein eingebautes Tracking. Beim Öffnen externer Webseiten gelten deren Datenschutzregeln. Keine Reisepassscans, vollständigen Kreditkartendaten oder Passwörter eintragen.</p><div class="actions"><button class="btn danger" id="wipe">Alle lokalen Daten löschen</button><button class="btn" id="print">Druckansicht</button></div></div>`}

function datesOfTrip(){let r=[], d=new Date('2027-01-26T12:00:00'),end=new Date('2027-02-24T12:00:00');while(d<=end){let iso=d.toISOString().slice(0,10),i=DATA.dates.findIndex(x=>x[0]<=iso&&iso<x[1]);if(i<0)i=11;r.push({iso,i});d.setDate(d.getDate()+1)}return r}

function budget(){
 const euro=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});

 const dayItems=items.filter(x=>x.date===expenseDay).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 const total=items.reduce((s,x)=>s+Number(x.amount||0),0);

 const d=new Date(expenseDay+'T12:00:00');

}

function downloadCalendar(){const clean=x=>String(x??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SA2027//Reiseplan//DE','CALSCALE:GREGORIAN'];DATA.trip.forEach((t,i)=>{let [a,b]=DATA.dates[i];lines.push('BEGIN:VEVENT','UID:stop-'+i+'@sa2027','DTSTAMP:20261013T000000Z','DTSTART;VALUE=DATE:'+a.replace(/-/g,''),'DTEND;VALUE=DATE:'+b.replace(/-/g,''),'SUMMARY:'+clean('Südafrika: '+t[0]),'DESCRIPTION:'+clean(t[3]),'END:VEVENT')});(state.bookings||[]).forEach((b,i)=>{if(!/^2027-\d\d-\d\d$/.test(b.date||''))return;let a=b.date.replace(/-/g,''),next=new Date(b.date+'T12:00:00');next.setDate(next.getDate()+1);lines.push('BEGIN:VEVENT','UID:booking-'+i+'@sa2027','DTSTAMP:20261013T000000Z','DTSTART;VALUE=DATE:'+a,'DTEND;VALUE=DATE:'+next.toISOString().slice(0,10).replace(/-/g,''),'SUMMARY:'+clean(b.type+': '+b.name),'DESCRIPTION:'+clean(b.status+' '+(b.info||'')),'END:VEVENT')});lines.push('END:VCALENDAR');let blob=new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Suedafrika-2027-Reisekalender.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}

function v13DayControls(){
 return `<div class="card v13-daytools"><label><span class="label">Reisetag</span><select class="field" id="v13Date">${v13Stops().map(d=>`<option value="${d.iso}" ${d.iso===v13Date?'selected':''}>${dt(d.iso)} · ${v13Esc(DATA.trip[d.i][0])}</option>`).join('')}</select></label><button class="btn" data-v13step="-1" ${v13Date==='2027-01-26'?'disabled':''}>← Vorheriger</button><button class="btn" data-v13step="1" ${v13Date==='2027-02-24'?'disabled':''}>Nächster →</button></div>`;
}
function v13StopTransfer(d){
 const isArrival=d.iso===DATA.dates[d.i][0]&&d.i>0;
 const isLast=d.iso==='2027-02-24';
 if(!isArrival&&!isLast)return '';
 const from=isLast?'Camps Bay':DATA.trip[d.i-1][0];
 const to=isLast?'Flughafen Kapstadt':DATA.trip[d.i][0];
 return `<div class="v13-warning"><strong>${isLast?'✈️ Rückflug um 19:50 Uhr':'🚗 Ortswechsel: '+v13Esc(from)+' → '+v13Esc(to)}</strong><p class="small">Fahrtzeit, Tankpause, Verkehrsreserve und ${isLast?'Mietwagenrückgabe sowie Check-in':'Unterkunfts-Check-in'} einplanen. Keine ungeprüften Minutenangaben.</p>${maps(to)}</div>`;
}
function v13Planned(iso){
 const picks=Object.entries(state.picks||{}).filter(([k,v])=>v===iso).map(([k])=>({name:k.split('::').slice(2).join('::'),kind:k.split('::')[0],time:typeof v10Info==='function'?(v10Info(k).time||''):''}));
 const bookings=(state.bookings||[]).filter(b=>b.date===iso).map(b=>({name:b.name,kind:b.type||'Buchung',time:'',status:b.status,ref:b.ref||'',info:b.info||''}));
 return [...picks,...bookings].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
}
function v13Assistant(){
 const d=v13Day(),stop=DATA.trip[d.i],items=v13Planned(d.iso);
 return `<div class="v13-hero"><h2>Dein Tagesassistent</h2><p>Reale Reiseroute · Planung mit Luft für Erlebnisse</p></div>${v13DayControls()}
 <div class="v13-grid"><section class="card"><span class="tag">${dt(d.iso)}</span><h3 class="title">${v13Esc(stop[0])}</h3><p class="small">${v13Esc(stop[3])}</p>${v13StopTransfer(d)}
 <h3 class="title">Dein Tagesablauf</h3>${(state.dayPlans||{})[d.iso]?`<div class="v13-item"><strong>📝 Persönlicher Tagesplan</strong><p class="small" style="white-space:pre-wrap">${v13Esc(state.dayPlans[d.iso])}</p></div>`:''}${items.length?items.map(x=>`<div class="v13-item"><strong>${x.time?v13Esc(x.time)+' · ':''}${v13Esc(x.name)}</strong><p class="v13-meta">${v13Esc(x.kind)}${x.status?' · '+v13Esc(x.status):''}</p>${x.info?`<p class="small">${v13Esc(x.info)}</p>`:''}</div>`).join(''):'<p class="small">Noch keine Aktivitäten oder Buchungen zugeordnet.</p>'}
 <div class="actions"><button class="btn primary" data-v13page="days">Tagesplan bearbeiten</button><button class="btn" data-v13page="bookinghub">Buchung erfassen</button></div></section>
 <section class="card"><h3 class="title">Sinnvolle Tageskombinationen</h3><p class="small">Vorschläge für diesen Reiseort, keine festgelegten Termine.</p>${(IDEAS[d.i]||[]).slice(0,4).map((a,i)=>`<div class="v13-item"><span class="v13-pill">${i+1}</span> ${v13Esc(a)}</div>`).join('')}
 <div class="v13-warning">Bei Golf etwa einen halben Tag plus Anfahrt einplanen; längere Wanderungen nicht mit mehreren entfernten Aktivitäten kombinieren. An Ortswechseltagen weniger vornehmen.</div>
 <div class="actions">${maps(stop[0])}<button class="btn" data-v13page="foodhub">Restaurants</button></div></section></div>`;
}
function v13BookingHub(){
 const bs=[...(state.bookings||[])].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
 const confirmed=bs.filter(b=>['Bestätigt','Bezahlt'].includes(b.status)).length;
 const pending=bs.filter(b=>!['Bestätigt','Bezahlt'].includes(b.status)).length;
 return `<div class="v13-hero"><h2>Buchungszentrale</h2><p>Alles an einem Ort · deine bestehenden Einträge bleiben erhalten</p></div>
 <div class="v13-grid"><div class="card stat"><strong>${confirmed}</strong><span>Bestätigt oder bezahlt</span></div><div class="card stat"><strong>${pending}</strong><span>Noch offen oder angefragt</span></div></div>
 <div class="card" style="margin-top:12px"><h3 class="title">Buchungen nach Reisedatum</h3>${bs.length?bs.map(b=>`<div class="v13-item"><div class="v13-inline"><span class="tag">${v13Esc(b.type||'Buchung')}</span><span class="v13-pill">${v13Esc(b.status||'Offen')}</span></div><h3>${v13Esc(b.name)}</h3><p class="small">${b.date?dt(b.date):'Datum noch offen'} ${b.ref?' · Referenz: '+v13Esc(b.ref):''}</p>${b.info?`<p class="small">${v13Esc(b.info)}</p>`:''}<button class="btn" data-v13edit="${v13Esc(b.id)}">✎ Bearbeiten</button></div>`).join(''):'<p class="small">Noch keine eigenen Buchungen gespeichert.</p>'}
 <button class="btn primary" data-v13page="plan">＋ Neue Buchung anlegen</button></div>
 <div class="notice">Reservierungsstatus wird nur aus deinen Eingaben übernommen. Eine Vormerkung in der Tagesplanung ist keine bestätigte Buchung. Vertrauliche Dokumente nicht öffentlich auf GitHub ablegen.</div>`;
}
const v13Normalize=s=>String(s||'').toLocaleLowerCase('de').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function v13Relevant(kind,i){
 const city=DATA.trip[i][0];
 const aliases={
  0:['kapstadt','tokai','somerset west','camps bay'],
  1:['hermanus'],2:['bredasdorp','agulhas'],3:['mossel bay'],
  4:['wilderness','george','herolds bay'],5:['plettenberg','knysna'],
  6:['tsitsikamma','storms river'],7:['jeffreys','st francis'],
  8:['addo'],9:['oudtshoorn'],10:['franschhoek','paarl'],11:['camps bay','kapstadt','tokai']
 };
 const match=aliases[i]||[v13Normalize(city)];
 return (kind==='golf'?DATA.golf:DATA.restaurants).filter(x=>match.some(a=>v13Normalize(x[kind==='golf'?1:0]).includes(a))).slice(0,9);
}
function v13PlaceHub(kind){
 const golf=kind==='golf',stop=DATA.trip[v13Region],items=v13Relevant(kind,v13Region);
 return `<div class="v13-hero ${golf?'':'v13-photo'}"><h2>${golf?'Golfplaner':'Restaurantplaner'}</h2><p>${golf?'16 Plätze entlang deiner Route':'Restaurantideen passend zu deinem Aufenthaltsort'}</p></div>
 <div class="card"><label class="label" for="v13Region">Reiseort auswählen</label><select id="v13Region" class="field">${DATA.trip.map((x,i)=>`<option value="${i}" ${i===v13Region?'selected':''}>${v13Esc(x[0])} · ${v13Esc(x[1])}</option>`).join('')}</select>
 <p class="small">Empfehlungen für ${v13Esc(stop[0])} und erreichbare Umgebung. Entfernungen und Verfügbarkeit bitte vor der Buchung prüfen.</p></div>
 <div class="v13-grid" style="margin-top:12px">${items.length?items.map(x=>`<article class="card"><span class="tag">${v13Esc(x[golf?1:0])}</span><h3 class="title">${v13Esc(x[golf?0:1])}</h3><p class="small">${v13Esc(x[2])}</p>${golf?`<p class="small muted">${v13Esc(x[3])}</p>`:''}<div class="actions">${href(x[golf?4:3],golf?'Club / Greenfees':'Restaurant / Menü')}${maps(x[golf?0:1])}</div><div class="actions"><button class="btn primary" data-v13book="${v13Esc(x[golf?0:1])}" data-v13type="${golf?'Golf':'Restaurant'}">＋ Buchung planen</button></div></article>`).join(''):'<div class="card"><p>Für diesen Reiseort ist noch kein passender Eintrag hinterlegt.</p></div>'}</div>
 <div class="notice">${golf?'Greenfees sind historische Orientierungswerte, keine bestätigten Tarife für Februar 2027. Startzeiten, Leihschläger und Spielberechtigung beim Club prüfen.':'Restaurantlinks und Empfehlungen sind keine Live-Verfügbarkeitsprüfung. Tischreservierungen bitte direkt bestätigen lassen.'}</div>`;
}
function v13OfflineHub(){
 const bookings=(state.bookings||[]).filter(b=>b.date&&b.date>='2027-01-26'&&b.date<='2027-02-24').sort((a,b)=>a.date.localeCompare(b.date));
 return `<div class="v13-hero v13-offline"><h2>Offline-Reisemappe</h2><p>Deine wichtigsten Daten auch ohne Mobilfunkverbindung</p></div>
 <div class="v13-warning">Die App-Oberfläche und lokal gespeicherte Daten sind nach dem ersten Online-Aufruf offline nutzbar. Externe Ortsfotos sind dabei nicht garantiert verfügbar. Google Maps, aktuelle Preise und externe Webseiten benötigen Internet. Kein automatischer Datenabgleich zwischen Geräten.</div>
 <div class="v13-grid"><section class="card"><h3 class="title">Feste Reiseetappen</h3>${DATA.trip.map((x,i)=>`<div class="v13-item"><strong>${String(i+1).padStart(2,'0')} · ${v13Esc(x[0])}</strong><p class="small">${v13Esc(x[1])} · ${v13Esc(x[2])}</p>${state.stopNotes?.[i]?`<p class="small">${v13Esc(state.stopNotes[i])}</p>`:''}</div>`).join('')}</section>
 <section class="card"><h3 class="title">Deine Reisebuchungen</h3>${bookings.length?bookings.map(b=>`<div class="v13-item"><strong>${v13Esc(b.name)}</strong><p class="small">${dt(b.date)} · ${v13Esc(b.type||'Buchung')} · ${v13Esc(b.status||'')}</p>${b.ref?`<p class="small">Referenz: ${v13Esc(b.ref)}</p>`:''}${b.info?`<p class="small">${v13Esc(b.info)}</p>`:''}</div>`).join(''):'<p class="small">Noch keine Buchungen erfasst.</p>'}
 <div class="actions"><button class="btn primary" data-v13page="data">Daten sichern</button><button class="btn" data-v13page="check">Reisecheckliste</button></div></section></div>`;
}

 if(['assistant','bookinghub','golfhub','foodhub','offlinehub'].includes(page)){

 }

};
document.addEventListener('click',function(e){
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v13page){e.preventDefault();e.stopImmediatePropagation();v13EditingBooking=null;v13Open(b.dataset.v13page);return}
 if(b.dataset.v13edit){e.preventDefault();e.stopImmediatePropagation();const entry=(state.bookings||[]).find(x=>String(x.id)===b.dataset.v13edit);if(!entry)return;v13EditingBooking=String(entry.id);v13Open('plan');for(const [id,val] of Object.entries({btype:entry.type,bstatus:entry.status,bname:entry.name,bdate:entry.date,bref:entry.ref,binfo:entry.info})){const el=document.getElementById(id);if(el)el.value=val||'';}const submit=document.querySelector('#bookingForm button[type=submit]');if(submit)submit.textContent='✓ Änderungen speichern';document.querySelector('#bname')?.focus();return}
 if(b.dataset.v13step){e.preventDefault();e.stopImmediatePropagation();const next=datePlus(v13Date,Number(b.dataset.v13step));if(next>='2027-01-26'&&next<='2027-02-24'){v13Date=next;render()}return}
 if(b.dataset.v13book){e.preventDefault();e.stopImmediatePropagation();v13EditingBooking=null;v13Open('plan');const day=document.querySelector('#bdate');if(day)day.value=v13Date;const name=document.querySelector('#bname');if(name){name.value=b.dataset.v13book;const type=document.querySelector('#btype');if(type)type.value=b.dataset.v13type;name.focus()}return}

document.addEventListener('submit',function(e){
 if(e.target.id!=='bookingForm'||!v13EditingBooking)return;
 e.preventDefault();e.stopImmediatePropagation();
 const item=(state.bookings||[]).find(x=>String(x.id)===v13EditingBooking);
 if(!item){v13EditingBooking=null;return}
 const name=document.getElementById('bname').value.trim();if(!name)return;
 Object.assign(item,{type:document.getElementById('btype').value,status:document.getElementById('bstatus').value,name:name.slice(0,140),date:document.getElementById('bdate').value,ref:document.getElementById('bref').value.trim().slice(0,120),info:document.getElementById('binfo').value.trim().slice(0,1500)});
 v13EditingBooking=null;save();render();
},true);
document.addEventListener('change',function(e){
 if(e.target.id==='v13Date'){e.stopImmediatePropagation();v13Date=e.target.value;render()}
 if(e.target.id==='v13Region'){e.stopImmediatePropagation();v13Region=Number(e.target.value);render()}
